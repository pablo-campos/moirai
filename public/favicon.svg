<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" fill="none">
  <defs>
    <linearGradient id="eclipse-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10e86a" />
      <stop offset="60%" stop-color="#0da651" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="corona-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10e86a" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#0da651" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#059669" stop-opacity="0.15" />
    </linearGradient>
    <mask id="eclipse-mask">
      <rect width="32" height="32" fill="#ffffff" />
      <circle cx="21" cy="16" r="11" fill="#000000" />
    </mask>
  </defs>

  <!-- Complete thin corona ring -->
  <circle cx="16" cy="16" r="12" stroke="url(#corona-grad)" stroke-width="1.5" />

  <!-- Luminous horizontal eclipse crescent -->
  <circle cx="16" cy="16" r="12" fill="url(#eclipse-grad)" mask="url(#eclipse-mask)" />
</svg>
